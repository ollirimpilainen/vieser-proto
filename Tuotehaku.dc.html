<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<title>Lattiakaivot, tuotehaku</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="vieser.css">
<link rel="stylesheet" href="tuotehaku.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div lang="{{ t.lang }}" style="width: 100%; box-sizing: border-box; background: #f6f5ed; color: #001e42; font-family: Figtree, 'Trebuchet MS', sans-serif; font-variant-numeric: tabular-nums">

  <div style="background: #001e42; color: #f6f5ed">
    <div style="max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 0 clamp(16px, 3vw, 40px); min-height: 44px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px; font-size: 14px">
      <div role="group" aria-label="{{ t.countryLabel }}" style="display: flex; align-items: center">
        <sc-for list="{{ maat }}" as="m" hint-placeholder-count="2">
          <button type="button" class="vs-tap th-country" aria-pressed="{{ m.valittu }}" onClick="{{ m.valitse }}" style="background: {{ m.bg }}; color: #f6f5ed; box-shadow: {{ m.viiva }}">{{ m.nimi }}</button>
        </sc-for>
      </div>
      <div class="vs-desk" style="display: flex; gap: 24px">
        <sc-for list="{{ t.top }}" as="x" hint-placeholder-count="3"><a href="#" style="color: #f6f5ed; text-decoration: none; min-height: 44px; display: inline-flex; align-items: center">{{ x }}</a></sc-for>
      </div>
    </div>
  </div>

  <header style="border-bottom: 1px solid #dac8ae">
    <div style="max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 0 clamp(16px, 3vw, 40px); min-height: 72px; display: flex; align-items: center; gap: 12px">
      <nav aria-label="{{ t.navLabel }}" class="vs-desk" style="flex: 1; display: flex; gap: 32px; font-size: 16px; font-weight: 700">
        <sc-for list="{{ nav }}" as="x" hint-placeholder-count="4"><a href="#" aria-current="{{ x.nyt }}" style="color: #001e42; text-decoration: none; padding: 24px 0; box-shadow: {{ x.viiva }}">{{ x.nimi }}</a></sc-for>
      </nav>
      <div class="vs-mob" style="flex: 1"></div>
      <img src="img/bbff548fc7da4a5ddc5f29400d6f3d65.svg" alt="{{ t.logoAlt }}" style="flex: none; height: 30px; width: auto; margin-left: 8px">
    </div>
  </header>

  <main style="max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: clamp(20px, 3vw, 32px) clamp(16px, 3vw, 40px) clamp(56px, 7vw, 112px)">
    <nav aria-label="{{ t.crumbLabel }}" style="font-size: 15px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; color: #44546a; margin: -12px 0 clamp(8px, 2vw, 24px)"><a href="#" style="color: #44546a; min-height: 44px; display: inline-flex; align-items: center">{{ t.crumb1 }}</a><span aria-hidden="true">/</span><span>{{ t.crumb2 }}</span></nav>

    <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 28px 64px; padding-bottom: 32px">
      <div style="flex: 1 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 16px">
        <h1 style="margin: 0; font-size: clamp(48px, 6vw, 92px); line-height: .9; font-weight: 900; letter-spacing: -.04em">{{ t.h1 }}</h1>
        <p style="margin: 0; font-size: clamp(18px, 1.5vw, 21px); line-height: 1.5; font-weight: 500; max-width: 34em">{{ lead }}</p>
      </div>
      <div style="flex: 0 1 460px; min-width: 0; display: flex; flex-direction: column; gap: 8px">
        <label for="th-q" style="font-size: 15px; font-weight: 700">{{ t.searchLabel }}</label>
        <div style="position: relative">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#001e42" stroke-width="2" aria-hidden="true" style="position: absolute; left: 16px; top: 17px"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
          <input id="th-q" type="search" class="th-search" value="{{ q }}" onInput="{{ hae }}" placeholder="{{ t.searchPh }}" autocomplete="off">
        </div>
      </div>
    </div>

    <div role="tablist" aria-label="{{ t.tabsLabel }}" style="display: flex; gap: 36px; border-bottom: 1px solid #dac8ae; margin-bottom: 36px">
      <sc-for list="{{ tabit }}" as="v" hint-placeholder-count="2">
        <button type="button" role="tab" class="vs-tap th-tab" aria-selected="{{ v.valittu }}" onClick="{{ v.valitse }}" style="color: {{ v.vari }}; box-shadow: {{ v.viiva }}">{{ v.nimi }}<span style="font-size: 15px; font-weight: 600; color: #44546a">{{ v.maara }}</span></button>
      </sc-for>
    </div>

    <div class="th-body">

      <aside class="th-side th-filters" aria-label="{{ t.filtersLabel }}">
        <div style="display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding-bottom: 12px; border-bottom: 2px solid #001e42">
          <h2 style="margin: 0; font-size: 20px; font-weight: 800">{{ t.filters }}</h2>
          <sc-if value="{{ onRajauksia }}" hint-placeholder-val="{{ false }}"><button type="button" class="vs-tap th-fit" onClick="{{ tyhjenna }}" style="font-size: 14px">{{ t.clearShort }}</button></sc-if>
        </div>
        <sc-for list="{{ fasetit }}" as="f" hint-placeholder-count="4">
          <fieldset style="margin: 0; padding: 18px 0 14px; border: 0; border-bottom: 1px solid #dac8ae; min-width: 0">
            <legend style="padding: 18px 0 6px; float: left; width: 100%; font-size: 14px; font-weight: 700; color: #44546a">{{ f.nimi }}</legend>
            <div style="clear: both; display: flex; flex-direction: column">
              <sc-for list="{{ f.opt }}" as="o" hint-placeholder-count="3">
                <label class="th-opt" style="color: {{ o.vari }}">
                  <input type="checkbox" class="vs-check" checked="{{ o.valittu }}" onChange="{{ o.vaihda }}">
                  <span class="th-optl">{{ o.nimi }}</span>
                  <span class="th-cnt" aria-label="{{ o.aria }}">{{ o.maara }}</span>
                </label>
              </sc-for>
            </div>
          </fieldset>
        </sc-for>
      </aside>

      <section aria-labelledby="th-tulos" style="min-width: 0">
        <div style="display: flex; flex-direction: column; gap: 14px; padding-bottom: 12px; border-bottom: 2px solid #001e42">
          <h2 id="th-tulos" aria-live="polite" style="margin: 0; font-size: 20px; font-weight: 800">{{ tulosOtsikko }}</h2>
          <sc-if value="{{ onSiruja }}" hint-placeholder-val="{{ false }}">
            <div role="group" aria-label="{{ t.activeLabel }}" style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center">
              <sc-for list="{{ sirut }}" as="c" hint-placeholder-count="2">
                <button type="button" class="vs-tap th-chip" onClick="{{ c.poista }}" aria-label="{{ c.aria }}">{{ c.nimi }}<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" aria-hidden="true"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
              </sc-for>
            </div>
          </sc-if>
          <p style="margin: 0; display: flex; flex-wrap: wrap; align-items: center; gap: 0 12px; font-size: 15px; line-height: 1.5; color: #44546a"><span>{{ sopivuus.t }}</span><button type="button" class="vs-tap th-fit" onClick="{{ sopivuus.tee }}">{{ sopivuus.nappi }}</button></p>
        </div>

        <sc-if value="{{ eiTuloksia }}" hint-placeholder-val="{{ false }}">
          <div style="padding: 48px 0; display: flex; flex-direction: column; gap: 16px; align-items: flex-start">
            <p style="margin: 0; font-size: 28px; line-height: 1.15; font-weight: 800; letter-spacing: -.02em">{{ t.emptyH }}</p>
            <p style="margin: 0; font-size: 17px; line-height: 1.6; color: #44546a; max-width: 30em">{{ tyhjaTeksti }}</p>
            <div style="display: flex; flex-wrap: wrap; gap: 12px">
              <sc-if value="{{ onEhdotus }}" hint-placeholder-val="{{ false }}"><button type="button" class="vs-tap vs-cta" onClick="{{ ehdotus.tee }}" style="min-height: 52px; padding: 0 22px; border: 0; background: #001e42; color: #ffffff; font-size: 16px; font-weight: 700">{{ ehdotus.nimi }}</button></sc-if>
              <button type="button" class="vs-tap vs-sec" onClick="{{ tyhjenna }}" style="min-height: 52px; padding: 0 22px; border: 0; background: transparent; box-shadow: inset 0 0 0 2px #001e42; font-size: 16px; font-weight: 700">{{ t.clear }}</button>
            </div>
          </div>
        </sc-if>

        <ul aria-label="{{ t.resultsLabel }}" style="margin: 0; padding: 0; list-style: none">
          <sc-for list="{{ tulokset }}" as="p" hint-placeholder-count="5">
            <li class="th-row">
              <div class="th-img pk"><img class="vs-prod" src="{{ p.img }}" alt=""></div>
              <div style="min-width: 0; display: flex; flex-direction: column; gap: 6px">
                <h3 style="margin: 0; font-size: 20px; line-height: 1.25; font-weight: 800; letter-spacing: -.01em"><a href="{{ p.link }}" class="th-name">{{ p.n }}</a></h3>
                <sc-if value="{{ p.onRivi }}" hint-placeholder-val="{{ true }}"><p style="margin: 0; font-size: 15px; line-height: 1.5; color: #44546a">{{ p.rivi }}</p></sc-if>
                <sc-if value="{{ p.onHuom }}" hint-placeholder-val="{{ false }}"><p style="margin: 0; font-size: 15px; line-height: 1.5; font-weight: 700">{{ p.huom }}</p></sc-if>
              </div>
              <p class="th-tun"><span style="color: #44546a">{{ p.tunL }}</span> {{ p.tun }}</p>
            </li>
          </sc-for>
        </ul>
      </section>
    </div>
  </main>

  <footer style="background: #001e42; color: #f6f5ed">
    <div style="max-width: 1360px; margin: 0 auto; box-sizing: border-box; padding: 40px clamp(16px, 3vw, 40px) 48px; display: flex; flex-wrap: wrap; gap: 24px; justify-content: space-between; align-items: flex-end">
      <div style="display: flex; flex-direction: column; gap: 6px">
        <p style="margin: 0; font-size: 18px; font-weight: 700">{{ t.footH }}</p>
        <p style="margin: 0; font-size: 15px; color: #bee2e9">{{ t.footAddr }}</p>
      </div>
      <img src="img/9a27841f6c5d3063de282c1fb00814b5.svg" alt="Vieser" style="height: 28px; width: auto">
    </div>
  </footer>
</div>

      h1: 'Lattiakaivot', searchLabel: 'Hae tuotteista', searchPh: 'Nimi, LVI-numero tai EAN',
      tabsLabel: 'Tuotetyyppi', tabKaivo: 'Kaivot', tabKansi: 'Kannet',
      unit: { kaivo: ['kaivo', 'kaivoa'], kansi: ['kansi', 'kantta'] },
      filtersLabel: 'Suodattimet', filters: 'Suodata', clear: 'Tyhjennä suodattimet', clearShort: 'Tyhjennä', activeLabel: 'Valitut rajaukset', remove: 'Poista rajaus',
      resultsLabel: 'Tuotteet', tunL: 'LVI',
      rivi: function (h, v) { return 'Korkeus ' + h + ' mm, virtaama ' + v + ' l/s'; },
      fitKaivo: function (n) { return 'Kaikki ' + n + ' kantta sopivat kaikkiin Vieser-kaivoihin.'; }, fitKansi: function (n) { return 'Kaikki kannet sopivat kaikkiin ' + n + ' kaivoon.'; }, showKansi: 'Näytä kannet', showKaivo: 'Näytä kaivot',
      emptyH: 'Näillä rajauksilla ei löydy tuotteita', emptyTxt: 'Poista jokin rajaus tai tyhjennä kaikki.', emptySug: function (v, n) { return 'Poista ' + v + ' (näytä ' + n + ')'; },
      lead: function (a, b) { return a + ' kaivoa ja ' + b + ' kantta. Rajaa teknisten tietojen mukaan ja näe heti, mitkä kannet sopivat.'; },
      count: function (n, u) { return n + ' ' + (n === 1 ? u[0] : u[1]); },
      footH: 'Tekninen asiakaspalvelu 020 746 4400', footAddr: 'Vieser Oy, Keskustie 23, 61850 Kauhajoki',
      facets: {
        kaivo: [
          { k: 'suunta', l: 'Lähtösuunta', o: ['Vaaka', 'Pysty', '45° kulma'] },
          { k: 'dn', l: 'Liitäntäkoko', o: ['DN32/40', 'DN50', 'DN75'] },
          { k: 'sivu', l: 'Sivuliitännät', o: ['Ei', '1 × 32', '3 × 32/40'], lab: { 'Ei': 'Ei sivuliitäntöjä' } },
          { k: 'h', l: 'Rakennekorkeus', o: ['69', '110', '115', '145', '252'], suf: ' mm' },
          { k: 'valu', l: 'Asennus', o: ['Valutuet mukana'] }
        ],
        kansi: [
          { k: 'malli', l: 'Kansimalli', o: ['Classic', 'Classic+', 'Link', 'Modern', 'Grid', 'Pyöreä', 'Flip'] },
          { k: 'kehys', l: 'Kehys', o: ['Muovikehys', 'Säädettävä teräskehys', 'Ei kehystä'] },
          { k: 'koko', l: 'Koko', o: ['197×197', '160×160', 'Ø150', '146×146'], suf: ' mm' },
          { k: 'vari', l: 'Väri', o: ['RST', 'Musta', 'Muovi'], lab: { 'RST': 'Ruostumaton teräs' } },
          { k: 'lisa', l: 'Lisäominaisuus', o: ['Ø32 läpivienti', 'Ø40 läpivienti', 'U-läpivienti', 'Lukittava', 'Laatoitettava'] }
        ]
      }
    };
  }
  vaihdaMaa(m) {
    if (m === this.state.maa) return;
    this.setState({ maa: m, tab: 'kaivo', f: {}, q: '' });
  }
  renderVals() {
    const s = this.state;
    const maa = s.maa;
    const T = this.tekstit(maa);
    const D = this.data()[maa];
    const tab = s.tab;
    const facets = T.facets[tab];
    const all = D.filter(p => p.t === tab);
    const nKaivo = D.filter(p => p.t === 'kaivo').length;
    const nKansi = D.filter(p => p.t === 'kansi').length;
    const q = (s.q || '').trim().toLowerCase().replace(/\s+/g, ' ');
    const qd = q.replace(/\s/g, '');
    const hakuOk = p => !q || p.n.toLowerCase().indexOf(q) >= 0 || (qd && (p.tun.indexOf(qd) >= 0 || p.ean.indexOf(qd) >= 0 || p.id.indexOf(qd) >= 0));
    const key = k => tab + ':' + k;
    const sel = k => s.f[key(k)] || [];
    const ok = (p, skip, f) => facets.every(F => {
      if (F.k === skip) return true;
      const v = f[key(F.k)] || [];
      return !v.length || v.indexOf(String(p[F.k])) >= 0;
    });
    const laske = f => all.filter(p => hakuOk(p) && ok(p, null, f)).length;
    const tulos = all.filter(p => hakuOk(p) && ok(p, null, s.f));
    const asetaF = (k, arr) => {
      const nf = Object.assign({}, s.f);
      if (arr.length) nf[key(k)] = arr; else delete nf[key(k)];
      this.setState({ f: nf });
    };
    const lab = (F, o) => (F.lab && F.lab[o]) || (o + (F.suf || ''));

    const fasetit = facets.map(F => ({
      nimi: F.l,
      opt: F.o.map(o => {
        const n = all.filter(p => hakuOk(p) && ok(p, F.k, s.f) && String(p[F.k]) === o).length;
        const on = sel(F.k).indexOf(o) >= 0;
        return {
          nimi: lab(F, o), maara: String(n), aria: n + ' ' + T.resultsLabel.toLowerCase(), valittu: on,
          vari: n || on ? '#001e42' : '#44546a',
          vaihda: () => { const cur = sel(F.k); asetaF(F.k, on ? cur.filter(x => x !== o) : cur.concat([o])); }
        };
      })
    }));

    const sirut = [];
    facets.forEach(F => sel(F.k).forEach(o => {
      const f2 = Object.assign({}, s.f); const rest = sel(F.k).filter(x => x !== o);
      if (rest.length) f2[key(F.k)] = rest; else delete f2[key(F.k)];
      sirut.push({ nimi: lab(F, o), aria: T.remove + ' ' + F.l + ' ' + lab(F, o), n: laske(f2), poista: () => asetaF(F.k, rest) });
    }));
    let ehdotus = null;
    if (!tulos.length && sirut.length) {
      const best = sirut.slice().sort((a, b) => b.n - a.n)[0];
      if (best.n > 0) ehdotus = { nimi: T.emptySug(best.nimi, best.n), tee: best.poista };
    }

    const tulokset = tulos.map(p => {
      const kaivo = p.t === 'kaivo';
      return {
        n: p.n, img: p.img, link: p.link || '#', tun: p.tun, tunL: T.tunL,
        rivi: kaivo ? T.rivi(p.h, p.v) : '', onRivi: kaivo,
        huom: p.huom || '', onHuom: !!p.huom
      };
    });

    let otsikko = T.count(tulos.length, T.unit[tab]);

    return {
      t: T,
      maat: [{ k: 'fi', nimi: 'Suomi' }, { k: 'se', nimi: 'Sverige' }].map(m => ({
        nimi: m.nimi, valittu: maa === m.k, bg: maa === m.k ? '#0f2d57' : 'transparent',
        viiva: maa === m.k ? 'inset 0 -3px 0 #c7ab86' : 'none', valitse: () => this.vaihdaMaa(m.k)
      })),
      nav: T.nav.map((n, i) => ({ nimi: n, nyt: i === 0 ? 'page' : 'false', viiva: i === 0 ? 'inset 0 -3px 0 #993300' : 'none' })),
      lead: T.lead(nKaivo, nKansi),
      q: s.q, hae: e => this.setState({ q: e && e.target ? e.target.value : '' }),
      tabit: [['kaivo', T.tabKaivo, nKaivo], ['kansi', T.tabKansi, nKansi]].map(x => ({
        nimi: x[1], maara: String(x[2]), valittu: tab === x[0],
        vari: tab === x[0] ? '#001e42' : '#44546a', viiva: tab === x[0] ? 'inset 0 -3px 0 #993300' : 'none',
        valitse: () => this.setState({ tab: x[0] })
      })),
      fasetit: fasetit, onRajauksia: sirut.length > 0, tyhjenna: () => this.setState({ f: {}, q: '' }),
      sirut: sirut, onSiruja: sirut.length > 0,
      sopivuus: tab === 'kaivo' ? { t: T.fitKaivo(nKansi), nappi: T.showKansi, tee: () => this.setState({ tab: 'kansi' }) } : { t: T.fitKansi(nKaivo), nappi: T.showKaivo, tee: () => this.setState({ tab: 'kaivo' }) },
      tulosOtsikko: otsikko, eiTuloksia: tulos.length === 0, tyhjaTeksti: T.emptyTxt,
      onEhdotus: !!ehdotus, ehdotus: ehdotus || { nimi: '', tee: null },
      tulokset: tulokset
    };
  }
}
</script>
